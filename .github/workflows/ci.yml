name: CI

on:
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]
        # The lockfile pins one Vite version, so also test each minor the peer range allows.
        vite-version: [ 'lockfile', '8.1', '8.2', 'latest' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - if: matrix.vite-version != 'lockfile'
        run: npm install --no-save vite@${{ matrix.vite-version }}
      - run: npm run coverage
      - run: npm run ci-test
      - run: npm run test:integration
